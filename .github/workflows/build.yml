name: Build and release

# Every push: test and build. On main, if the tag v<versionName> doesn't exist yet, publish a
# GitHub Release with the signed APK. Obtainium tracks those releases.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret: the APK is debug-signed and will not be released."
          fi

      - name: Test, lint and build
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          OUT="SendToCar-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SendToCar-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release (main only, signed only, new version only)
        if: github.ref == 'refs/heads/main' && env.SIGNING_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released; bump versionName/versionCode to publish."
            exit 0
          fi
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" --target "${{ github.sha }}" \
            --title "Send to Car ${{ steps.apk.outputs.version }}" \
            --notes "Install the same APK on the phone and on the car unit. SHA-256: \`$(sha256sum "${{ steps.apk.outputs.file }}" | cut -d' ' -f1)\`" \
            --generate-notes
